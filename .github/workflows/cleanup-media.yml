name: cleanup-media
# Keeps the media branch small: rebuilds it with only the videos of the last 3 days.
on:
  schedule: [{ cron: "30 3 * * 0" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: media, fetch-depth: 1 }
      - run: |
          keep=$(for d in 0 1 2 3; do date -u -d "-$d day" +%F; done | paste -sd'|')
          mkdir /tmp/keep; for f in videos/*.mp4; do echo "$f" | grep -qE "$keep" && cp "$f" /tmp/keep/ || true; done
          git config user.name daily-news-bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan fresh; git rm -rqf .; mkdir -p videos; cp /tmp/keep/* videos/ 2>/dev/null || true
          git add videos; git commit -qm "media (last 3 days)" --allow-empty; git push -f origin fresh:media
