name: buffer-setup
on: workflow_dispatch
permissions:
  contents: write
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/setup_info.py > /tmp/setup.txt 2>&1 || true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PYTHONPATH: scripts
      - name: publish result to bot-logs branch
        run: |
          git config user.name daily-news-bot; git config user.email bot@users.noreply.github.com
          git fetch origin bot-logs || true
          git checkout -B bot-logs
          git rm -rq --cached . ; rm -rf ./* .github scripts
          mkdir -p logs; cp /tmp/setup.txt logs/setup.txt
          git add logs; git commit -qm "setup log" ; git push -f origin bot-logs
